version: '3.8'

services:
  db:
    image: postgres:15
    container_name: flint_db
    environment:
      POSTGRES_USER: flint
      POSTGRES_PASSWORD: flintpassword
      POSTGRES_DB: flint
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
